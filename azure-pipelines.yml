trigger: none

pool: Default

jobs:
- job: Terraforminitiate
  displayName: Terraform init&all
  
  steps: 
  - task: PowerShell@2
    inputs:
      targetType: 'inline'
      script: |
        terraform init
        terraform fmt
        terraform validate
        terraform plan

- job:
  displayName: Terraform apply
  dependsOn: Terraforminitiate
  steps:
  - task: PowerShell@2
    inputs:
      targetType: 'inline'
      script: |
        terraform init
        terraform apply -auto-approve


