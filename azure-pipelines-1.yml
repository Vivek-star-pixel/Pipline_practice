trigger: none

pool: Default

jobs:
- job: Terraform_scheduler
  displayName: Terrraform init
  steps:

  - task: PowerShell@2
    

    inputs:
      targetType: 'inline'
      script: |
        ls
        terraform init

- job: Terraform_initiate
  dependsOn: Terraform_scheduler
  displayName: Terrraform FMT&Validate
  steps:

  - task: PowerShell@2
    
    inputs:
      targetType: 'inline'
      script: |
        terraform init
        terraform fmt
        Terraform validate

- job: Terraform_planapply
  dependsOn: Terraform_initiate
  displayName: Terrraform PA
  steps:
  - task: PowerShell@2
    
    inputs:
      targetType: 'inline'
      script: |
        terraform init
        terraform plan
        terraform apply
      
